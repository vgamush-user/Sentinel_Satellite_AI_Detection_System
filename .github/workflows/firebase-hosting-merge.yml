name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install pnpm on the runner
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      # 2. Set up Node.js with pnpm caching inside the subfolder
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      # 3. Install dependencies inside the subfolder
      - run: pnpm install
        working-directory: ./frontend

      # 4. Build the project inside the subfolder
      - run: pnpm run build
        working-directory: ./frontend

      # 5. Deploy to Firebase Hosting using the subfolder entry point
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENTINELSAT_911A5 }}
          channelId: live
          projectId: sentinelsat-911a5
          entryPoint: ./frontend
